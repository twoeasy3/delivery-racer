<!doctype html><meta charset="utf-8"><body style="margin:0;background:#e9ebee;font:14px sans-serif"><canvas id="c"></canvas><div id="labels"></div>
<script type="module">
// the FLANK DECAL feasibility page (CHECKLIST 414, src/delivery/DECAL-FEASIBILITY.md), for scripts/shots.mjs: cars built as the showroom
// builds them (as render/showcar.js makeShowCar, as delivery/propview.html does: showcar.js imports the whole game) with the prototype's
// dressing (render/flankdecal.js dressFlankDecal, the call dressCosmetics makes: ?decaltest= puts it on), seen
// square from the side. ?car=<id>&view=left|right|pair|34|close  (pair: the left flank over the right, each seen from its own side)
//   &cars=<id>,<id>,...   a sheet: each car a cell (pair), two columns     &damage=<percent>  dented as the game does (render/inspectmodel.js)
//   &evil=1  the Evil livery      &blackout=1  every part in the blacked-out look (render/silhouette.js)
//   &decaltest=zones|1|both|curve  &decallift=<mm>  &decalnum=<n>  (read by render/flankdecal.js itself)
//   THE DECAL COSMETIC (CHECKLIST 423, render/decalcosmetic.js dressDecal, as dressCosmetics calls it): &decal=<id>[,<colour>] (read by the
//   module itself: every car wears it), or &designs=all|<id>,<id>  a sheet of ONE car (&car=) in each design (&colour=<swatch|hex|match>)
import * as THREE from 'three';
import { MODELS } from '/src/delivery/render/models.js';
import { makeIdeaModel } from '/src/delivery/render/ideaModels.js';
import { addSuperKit } from '/src/delivery/render/carExtras.js';
import { patchModel } from '/src/delivery/render/modelpatchapply.js';
import { dressFlankDecal } from '/src/delivery/render/flankdecal.js';
import { dressDecal, DESIGNS } from '/src/delivery/render/decalcosmetic.js';
import { dentModel, scorch } from '/src/delivery/render/dents.js';
import { silhouetteFor } from '/src/delivery/render/silhouette.js';
const q = new URLSearchParams(location.search), view = q.get('view') || 'pair';
const designs = q.get('designs') ? (q.get('designs') === 'all' ? DESIGNS.map(d => d.id) : q.get('designs').split(',')) : null;
const ids = designs ? designs.map(() => q.get('car') || 'postvan') : (q.get('cars') || q.get('car') || 'postvan').split(',');
const W = +q.get('w') || 1400, cols = ids.length > 1 ? 2 : 1, rows = Math.ceil(ids.length / cols);
const cellH = ids.length > 1 ? 440 : (+q.get('h') || 900), H = cellH * rows;
// (the cars as JSON, written by scripts/decal-zones.mjs: the game's cars.js cannot be imported without the whole game's page)
const all = Object.values(await (await fetch('/delivery/decalcars.json')).json());
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, preserveDrawingBuffer: true });
r.setSize(W, H); r.setPixelRatio(1); r.setScissorTest(true); r.setClearColor(0xe9ebee);
r.info.autoReset = false;
const labels = document.getElementById('labels');
const label = (x, y, text) => { const d = document.createElement('div'); d.textContent = text; d.style.cssText = 'position:absolute;left:' + (x + 8) + 'px;top:' + (y + 6) + 'px;color:#222;background:#ffffffcc;padding:2px 6px;border-radius:4px;white-space:pre'; labels.appendChild(d); };
const cam = (model, kind, aspect) => {
  const box = new THREE.Box3().setFromObject(model), size = box.getSize(new THREE.Vector3()), mid = box.getCenter(new THREE.Vector3());
  if (kind === 'left' || kind === 'right') {
    const c = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 100), s = kind === 'left' ? -1 : 1;
    c.position.set(s * 30, mid.y, mid.z); c.lookAt(mid.x, mid.y, mid.z);
    const hh = Math.max(size.y / 2, size.z / 2 / aspect) * 1.08;
    c.left = -hh * aspect; c.right = hh * aspect; c.top = hh; c.bottom = -hh; c.updateProjectionMatrix();
    return c;
  }
  const c = new THREE.PerspectiveCamera(kind === 'close' ? 22 : 30, aspect, 0.1, 200), R = Math.max(size.x, size.y, size.z);
  if (kind === 'close') c.position.set(-R * 0.55, mid.y + R * 0.05, mid.z + R * 0.75); // (grazing along the left flank from the front)
  else c.position.set(-R * 1.1, mid.y + R * 0.45, mid.z + R * 1.05);
  c.lookAt(mid);
  return c;
};
const scenes = [];
ids.forEach((id, k) => {
  const car = all.find(c => c.id === id);
  if (!car) { console.warn('no car ' + id); return; }
  const scene = new THREE.Scene();
  scene.add(new THREE.HemisphereLight(0xffffff, 0x777777, 1.5));
  const d = new THREE.DirectionalLight(0xffffff, 1.3); d.position.set(-6, 9, 5); scene.add(d);
  const d2 = new THREE.DirectionalLight(0xffffff, 0.9); d2.position.set(6, 7, -4); scene.add(d2);
  const model = car.idea ? patchModel(makeIdeaModel(car), car) : MODELS[car.model](car);
  if (!car.idea && (car.super || car.superKit)) addSuperKit(model, car);
  if (!car.idea) patchModel(model, car);
  dressDecal(model, car, designs ? { look: { id: designs[k], colour: q.get('colour') || 'match' } } : {});
  dressFlankDecal(model, car);
  const evil = q.get('evil') === '1';
  model.userData.body?.material.color.setHex((evil ? car.evilColor : car.color) ?? car.color); // (render/showcar.js paintShowCar)
  model.userData.livery?.(evil);
  model.userData.animate?.(0);
  scene.add(model);
  model.updateMatrixWorld(true);
  if (q.get('damage')) { const share = Math.min(100, +q.get('damage')) / 100; dentModel(model, model.userData.body, share); scorch(model.userData.body.material.color, share); } // (as render/items.js does for the player's car)
  if (q.get('blackout')) model.traverse(n => { if (n.isMesh) n.material = silhouetteFor(n.material); });
  scenes.push({ id, car, model, scene, k });
});
const cellW = W / cols;
const decalOf = (m) => { const out = []; m.traverse(n => { if (n.userData.flankDecal) out.push(n); }); return out; };
for (const { car, model, scene, k } of scenes) {
  const x0 = (k % cols) * cellW, y0 = Math.floor(k / cols) * cellH; // (from the top)
  const draw = (kind, x, yTop, w, h) => { r.setViewport(x, H - yTop - h, w, h); r.setScissor(x, H - yTop - h, w, h); r.render(scene, cam(model, kind, w / h)); };
  const parts = view === 'pair' || ids.length > 1 ? [['left', 0], ['right', 0.5]] : [[view, 0]];
  const hh = parts.length > 1 ? cellH / 2 : cellH;
  for (const [kind, f] of parts) draw(kind, x0, y0 + f * cellH, cellW, hh);
  // the cost: draw calls and triangles with the decal and without it (one more frame of the first view, counted)
  const decals = decalOf(model), count = (on) => { decals.forEach(n => { n.visible = on; }); r.info.reset(); r.setScissor(0, 0, 1, 1); r.setViewport(0, 0, 1, 1); r.render(scene, cam(model, 'left', 1)); return { calls: r.info.render.calls, tris: r.info.render.triangles }; };
  const on = count(true), off = count(false); decals.forEach(n => { n.visible = true; });
  const plan = model.userData.decalPlan, ps = plan?.worn && plan.stats;
  const st = model.userData.flankDecal_decal || model.userData.flankDecal_zones || (ps && { triangles: ps.triangles, rays: ps.rays });
  const size = ps ? '\n' + plan.worn.id + ' ' + plan.worn.colour + '  S ' + ps.S.toFixed(2) + ': ' + ps.rects.map(r => r.zone + ' ' + (r.z1 - r.z0).toFixed(2) + ' x ' + (r.y1 - r.y0).toFixed(2) + ' m').join(', ') : '';
  const text = car.name + ' (' + (car.model || car.id) + ')' + (q.get('damage') ? '  damage ' + q.get('damage') + '%' : '') + (q.get('evil') === '1' ? '  Evil' : '  Good')
    + (st ? '\ndecal: +' + (on.calls - off.calls) + ' draw call, +' + (on.tris - off.tris) + ' triangles drawn (' + st.triangles + ' built), ' + st.rays + ' rays' : '\nno decal') + size;
  if (parts.length > 1) { label(x0, y0, text + '\nLEFT flank (seen from the left)'); label(x0, y0 + cellH / 2, 'RIGHT flank (seen from the right)'); } else label(x0, y0, text + '\n' + view);
}
// a repaint of the views after the counting frames (the counting drew into a corner)
for (const { model, scene, k } of scenes) {
  const x0 = (k % cols) * cellW, y0 = Math.floor(k / cols) * cellH;
  const parts = view === 'pair' || ids.length > 1 ? [['left', 0], ['right', 0.5]] : [[view, 0]], hh = parts.length > 1 ? cellH / 2 : cellH;
  for (const [kind, f] of parts) { r.setViewport(x0, H - (y0 + f * cellH) - hh, cellW, hh); r.setScissor(x0, H - (y0 + f * cellH) - hh, cellW, hh); r.render(scene, cam(model, kind, cellW / hh)); }
}
document.title = 'done';
</script>
